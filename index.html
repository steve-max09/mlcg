<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MLCG - Mega Loxam Confrontation Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section id="main-menu" class="screen active">
      <div class="menu-bg"></div>

      <header class="menu-header">
        <h1>MLCG</h1>
        <p>Mega Loxam Confrontation Game</p>
      </header>

      <main class="menu-content">
        <button class="menu-btn primary" id="playBtn">Jouer</button>
        <button class="menu-btn" id="open-deck-btn">Deck</button>
        <button class="menu-btn">Options</button>
      </main>

      <footer class="menu-footer">
        <span>Prototype hors ligne</span>
      </footer>
    </section>

    <section id="deck-screen" class="screen">
      <div class="deck-header">
        <button class="icon-btn" id="deck-back-btn">←</button>
        <h2>Deck</h2>
        <div class="yanga-display">
          <img src="assets/ui/yanga.png" alt="Yanga" />
          <span id="yanga-amount">0</span>
        </div>
      </div>

      <div class="owned-chests-row" id="owned-chests-row"></div>

      <div class="deck-slots" id="deck-slots"></div>

      <div class="deck-actions-row">
        <button class="menu-btn primary" id="battle-btn" disabled>Combat</button>
        <button class="menu-btn secondary" id="open-chests-btn">Coffres</button>
      </div>

      <div class="collection-header">
        <h3>Collection</h3>
        <span id="collection-count">0/8</span>
      </div>

      <div class="collection-grid" id="collection-grid"></div>
    </section>

    <div class="modal-overlay" id="unit-detail-modal">
      <div class="unit-detail-card">
        <button class="modal-close" id="unit-detail-close">×</button>
        <h2 id="unit-detail-name"></h2>
        <div class="unit-detail-badges">
          <span class="badge" id="unit-detail-cost"></span>
        </div>
        <img id="unit-detail-sprite" src="" alt="" />
        <p id="unit-detail-description"></p>
        <div class="unit-detail-stats">
          <div class="stat-row"><span>PV</span><span id="unit-detail-hp"></span></div>
          <div class="stat-row"><span>Dégâts</span><span id="unit-detail-damage"></span></div>
          <div class="stat-row"><span>Vitesse d'attaque</span><span id="unit-detail-atkspeed"></span></div>
          <div class="stat-row"><span>Portée</span><span id="unit-detail-range"></span></div>
          <div class="stat-row"><span>Vitesse</span><span id="unit-detail-movespeed"></span></div>
        </div>
        <button class="menu-btn primary" id="unit-detail-action"></button>
      </div>
    </div>

    <section id="arena-screen" class="screen">
      <main id="arena">
        <div class="lane enemy-side"></div>
        <div class="mid-line"></div>
        <div class="lane player-side"></div>
      </main>

      <footer class="bottom-ui">
        <div class="energy-bar-wrap">
          <div class="energy-row">
            <div class="energy-bar">
              <div class="energy-fill" id="energyFill"></div>
            </div>
            <span class="energy-value" id="energyValue">5/10</span>
          </div>
        </div>

        <div class="hand" id="handContainer"></div>
      </footer>
    </section>

    <section id="victory-screen" class="screen">
      <div class="victory-content">
        <h1 id="victoryTitle">Victoire !</h1>
        <p id="victorySubtitle">La base ennemie est détruite.</p>
        <button class="menu-btn primary" id="backToMenuBtn">Retour au menu</button>
      </div>
    </section>

    <section id="chest-shop-screen" class="screen">
      <div class="deck-header">
        <button class="icon-btn" id="chest-shop-back-btn">←</button>
        <h2>Coffres</h2>
        <div class="yanga-display">
          <img src="assets/ui/yanga.png" alt="Yanga" />
          <span id="chest-shop-yanga">0</span>
        </div>
      </div>

      <div class="chest-shop-grid" id="chest-shop-grid"></div>
    </section>

    <div class="modal-overlay" id="chest-open-modal">
      <div class="chest-open-card">
        <img id="chest-open-sprite" src="" alt="" class="chest-open-sprite" />
        <div class="chest-reveal" id="chest-reveal">
          <img id="chest-reveal-sprite" src="" alt="" />
          <h3 id="chest-reveal-name"></h3>
          <span class="rarity-label" id="chest-reveal-rarity"></span>
        </div>
        <button class="menu-btn primary hidden" id="chest-reveal-close">Continuer</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
